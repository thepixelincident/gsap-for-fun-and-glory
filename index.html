  <title>The Pixel Incident</title>
  <link href="https://fonts.googleapis.com/css2?family=Monofett&display=swap" rel="stylesheet">
  <style>

  display: flex;
  flex-direction: row;
  font-family: 'Monofett', cursive;

canvas {
  margin-top: clamp(16px, 4vw, 40px);

  max-height: min(400px, 90vw);
}

  </style>

<body>
  <!-- container - main -->
  <div id="containter-main" class="container-main"> 
    <!-- container - demo jellyfish -->
    <div id="container-demo" class="container-demo"> 

      <!-- canvas test -->
      <canvas id="jellyfish" width="400" height="400"></canvas>
      <!-- container - demo - THEPIXELINCIDENT --> 
      <div id="the-pixel-incident" class="the-pixel-incident">
        <p>THEPIXELINCIDENT</p>
      </div>

    </div>
  </div>
</body>

<script>

const canvas = document.getElementById('jellyfish');
const ctx = canvas.getContext('2d');
const w = 400;
let t = 0;
let flashI = -1;
let flashRadius = 0;
let flashCooldown = Math.random() * 600 + 200;

function mag(a, b) {
  return Math.sqrt(a * a + b * b);
}

function draw() {
  ctx.fillStyle = 'rgba(9, 9, 9, 1)';
  ctx.fillRect(0, 0, w, w);

  t += Math.PI / 60;

  flashCooldown--;
  if (flashCooldown <= 0) {
    flashI = Math.floor(Math.random() * 10000);
    flashRadius = 0;
    flashCooldown = Math.random() * 600 + 200;
  }
  flashRadius += 80;

  for (let i = 10000; i--;) {
    const y = i / 43;
    const k = 5 * Math.cos(i / 14) * Math.cos(y / 30);
    const e = y / 8 - 13;
    const d = mag(k, e) ** 2 / 59 + 6;
    const q = 90 - 5 * Math.sin(Math.atan2(k, e) * e) + k * (3 + Math.sin(d * d - t * 2));
    const c = d / 2 - t / 18;
    const px = (q + d * d ** Math.sin(d * 2 - t / 3)) * Math.cos(c) + 200;
    const py = q * Math.sin(c) + 200;

    const distFromFlash = Math.abs(i - flashI);
    if (distFromFlash < flashRadius && distFromFlash > flashRadius - 200) {
      const brightness = 1 - (distFromFlash - (flashRadius - 200)) / 200;
      ctx.fillStyle = `rgba(255, 255, 255, ${0.26 + brightness * 0.74})`;
    } else {
      ctx.fillStyle = 'rgba(146, 146, 146, 0.26)';
    }

    ctx.fillRect(px, py, 1, 1);
  }

  requestAnimationFrame(draw);
}

draw();

</script>
